<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Станция печати</title>
<style>
/* РАЗМЕР НАКЛЕЙКИ. Размер рулона пока неизвестен, по умолчанию 58 x 40 мм. Меняются только эти две строки:
   @page берёт их отсюда скриптом (CSS не принимает var() в правиле @page), вёрстка наклейки тоже. */
:root { --label-w: 58mm; --label-h: 40mm; }

/* Станция печати на ноутбуке у входа. Токены: memory-bank/features/design.md. Фон всегда белый, тёмной темы нет. */
:root {
  --bg: #FFFFFF; --group: #F5F5F7; --ink: #1D1D1F; --muted: #6E6E73; --hair: rgba(0,0,0,.08);
  --accent: #0071E3;
  /* Панель статуса держит белый текст не ниже 4,5:1: яркие #34C759 и #FF3B30 дают с белым 2,2:1 и 3,6:1 */
  --ok: #1E7F3C; --bad: #C4261D; --warn: #A35A00; --warn-soft: rgba(255,159,10,.14);
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  /* Liquid Glass поверх белого: заливка, кромка (светлый верх + волосок), тень. Карточка очереди и кнопка лежат на белом
     со свечением, под ними ничего не движется, поэтому размытие не включается: только светлая заливка, кромка и тень. */
  --glass: rgba(255,255,255,.92);
  --glass-rim: inset 0 1px 0 rgba(255,255,255,.9), 0 0 0 .5px rgba(0,0,0,.08);
  --glass-shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 16px rgba(0,0,0,.07);
  /* Мягкое свечение за стеклом: страница остаётся белой, стеклу есть что преломлять */
  --glow: radial-gradient(ellipse 560px 300px at 8% 0, rgba(0,113,227,.08), transparent 70%), radial-gradient(ellipse 460px 260px at 96% 4%, rgba(90,200,250,.09), transparent 70%);
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
}
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  :root { --glass: rgba(255,255,255,.72); }
}
/* Пользователь просит меньше прозрачности или больше контраста: стекло становится почти сплошным */
@media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
  :root { --glass: rgba(255,255,255,.97); }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.wrap { position: relative; z-index: 0; max-width: 1080px; margin: 0 auto; padding: 24px 32px 40px; display: grid; gap: 24px; }
.wrap::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: var(--glow); }
.rule { margin: 0; padding: 12px 18px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); text-wrap: pretty; }

.top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; }
.status { display: flex; align-items: center; gap: 20px; min-height: 120px; padding: 24px 32px; border-radius: 28px; color: #fff; background-color: var(--ok); background-image: linear-gradient(180deg, rgba(0,0,0,0) 20%, rgba(0,0,0,.14)); box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 12px 28px -10px rgba(20,97,43,.55); }
.status.bad { background-color: var(--bad); box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 12px 28px -10px rgba(168,31,23,.5); }
.status svg { flex: none; width: 64px; height: 64px; padding: 14px; border-radius: 50%; background: linear-gradient(160deg, rgba(255,255,255,.26), rgba(255,255,255,.1)); box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 0 0 1px rgba(255,255,255,.2), 0 8px 20px rgba(0,0,0,.16); fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.status b { display: block; font-size: 32px; line-height: 1.15; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
.status span { display: block; margin-top: 4px; font-size: 20px; line-height: 1.3; font-weight: 400; text-wrap: pretty; }
.queue { display: grid; grid-auto-flow: column; place-content: center; min-width: 240px; align-items: baseline; gap: 12px; align-self: stretch; margin: 0; padding: 0 40px; border: 0; border-radius: 28px; background: var(--glass); box-shadow: var(--glass-rim), var(--glass-shadow); color: var(--muted); font-size: 20px; white-space: nowrap; }
.queue b { color: var(--ink); font-size: 56px; line-height: 1; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

.head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.head .btns { display: flex; flex-wrap: wrap; gap: 8px; }
h2 { margin: 0; font-size: 22px; line-height: 1.2; font-weight: 600; letter-spacing: -.01em; }
.note { margin: -12px 0 0; color: var(--muted); text-wrap: pretty; }
.btn { min-height: 48px; padding: 0 20px; border: 0; border-radius: 14px; background: var(--glass); color: var(--ink); font-size: 17px; font-weight: 600; box-shadow: var(--glass-rim), var(--glass-shadow); transition: transform 160ms var(--ease), background-color 160ms var(--ease); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .4; cursor: default; transform: none; box-shadow: var(--glass-rim); }
@media (hover: hover) { .btn:not(:disabled):hover { background: #fff; } }

/* Последние напечатанные: список-группа, строки через тонкие разделители */
.done { margin: 0; padding: 0; list-style: none; overflow: hidden; border-radius: 20px; background: var(--bg); box-shadow: 0 0 0 1px var(--hair), var(--shadow); }
.done:empty { box-shadow: none; }
.card { position: relative; display: flex; align-items: center; gap: 8px 12px; min-height: 68px; padding: 10px 12px 10px 20px; }
.card + .card::before { content: ""; position: absolute; top: 0; left: 20px; right: 0; height: 1px; background: var(--hair); }
.who { flex: 1; min-width: 0; display: grid; }
.who b { font-size: 18px; line-height: 1.25; font-weight: 600; text-wrap: balance; overflow-wrap: break-word; }
.who span { font-size: 15px; color: var(--muted); text-wrap: pretty; overflow-wrap: break-word; }
.card .btn { flex: none; margin-left: auto; background: var(--group); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.06); font-size: 16px; }
@media (hover: hover) { .card .btn:not(:disabled):hover { background: #EBEBED; } }
.empty { margin: 0; padding: 28px 20px; border-radius: 20px; background: var(--group); color: var(--muted); font-size: 17px; text-align: center; text-wrap: pretty; }

/* Узкий экран (телефон, половина экрана ноутбука): всё в одну колонку, статус и очередь читаются целиком. */
@media (max-width: 720px) {
  .wrap { padding: 16px 16px 32px; gap: 16px; }
  .top { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .status { min-height: 0; padding: 20px; gap: 16px; }
  .status svg { width: 48px; height: 48px; padding: 10px; }
  .status b { font-size: 22px; }
  .status span { font-size: 16px; }
  .queue { grid-auto-flow: column; place-content: space-between; min-width: 0; padding: 16px 20px; font-size: 18px; }
  .queue b { font-size: 40px; }
  .head { flex-wrap: wrap; }
  h2 { font-size: 20px; }
}
/* Совсем узкое окно: длинное имя занимает строку целиком, кнопка уходит под него и не сжимает слова */
@media (max-width: 519px) {
  .card { flex-wrap: wrap; }
  .who { flex: 1 1 auto; }
}

/* Шрифт наклейки Caveat лежит рядом со страницей (vendor/fonts/): печать не зависит от интернета и Google Fonts.
   Файлы woff2 из @fontsource/caveat 5.3.0, лицензия OFL-1.1 в vendor/fonts/Caveat.LICENSE. Казахские буквы (Ә Ғ Қ Ң Ө Ү Һ) в наборе cyrillic-ext. */
@font-face { font-family: "Caveat"; font-style: normal; font-weight: 400; font-display: swap; src: url(vendor/fonts/caveat-cyrillic-ext-400-normal.woff2) format("woff2"); unicode-range: U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F; }
@font-face { font-family: "Caveat"; font-style: normal; font-weight: 700; font-display: swap; src: url(vendor/fonts/caveat-cyrillic-ext-700-normal.woff2) format("woff2"); unicode-range: U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F; }
@font-face { font-family: "Caveat"; font-style: normal; font-weight: 400; font-display: swap; src: url(vendor/fonts/caveat-cyrillic-400-normal.woff2) format("woff2"); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
@font-face { font-family: "Caveat"; font-style: normal; font-weight: 700; font-display: swap; src: url(vendor/fonts/caveat-cyrillic-700-normal.woff2) format("woff2"); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
@font-face { font-family: "Caveat"; font-style: normal; font-weight: 400; font-display: swap; src: url(vendor/fonts/caveat-latin-ext-400-normal.woff2) format("woff2"); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
@font-face { font-family: "Caveat"; font-style: normal; font-weight: 700; font-display: swap; src: url(vendor/fonts/caveat-latin-ext-700-normal.woff2) format("woff2"); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
@font-face { font-family: "Caveat"; font-style: normal; font-weight: 400; font-display: swap; src: url(vendor/fonts/caveat-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
@font-face { font-family: "Caveat"; font-style: normal; font-weight: 700; font-display: swap; src: url(vendor/fonts/caveat-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
/* Наклейка: только чёрный на белом. Вне печати прячется за краем экрана, но остаётся в вёрстке, чтобы мерить текст.
   Вид по образцу Дианы (private/images/1623-…): как написано ручкой — тонко, влево, лесенкой, с лёгким наклоном. */
#sticker { position: fixed; left: -10000px; top: 0; width: var(--label-w); height: var(--label-h); padding: 2.2mm 3mm; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; overflow: hidden; background: #fff; color: #000; text-align: left; font-family: "Caveat", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive; font-weight: 700; line-height: 1.02; }
#sticker .fit { display: block; width: max-content; white-space: nowrap; transform: rotate(-3deg); transform-origin: left center; }
#st-last { margin-left: 4mm; }
/* Имя и фамилия жирно, должность и компания тонко: главное читается первым. */
#st-pos, #st-comp { margin-left: 1.5mm; font-weight: 400; }
#st-pos { margin-top: 1mm; }
#sticker .fit:empty { display: none; }
@media print {
  html, body { margin: 0; padding: 0; background: #fff; }
  .screen { display: none !important; }
  /* На 0,5 мм ниже страницы: иначе округление добавляет вторую пустую наклейку. */
  #sticker { position: static; height: calc(var(--label-h) - 0.5mm); }
}
</style>
</head>
<body>
<main class="wrap screen">
  <p class="rule">Держите эту вкладку открытой весь форум. Вторую станцию не открывайте: наклейки напечатаются дважды</p>

  <section class="top">
    <div class="status" id="status" role="status"><svg viewBox="0 0 24 24" id="st-ico" aria-hidden="true"></svg><div><b id="st-title"></b><span id="st-sub" hidden></span></div></div>
    <p class="queue" id="queue">В очереди: <b id="q">0</b></p>
  </section>

  <section style="display:grid;gap:16px">
    <div class="head">
      <h2>Последние напечатанные</h2>
      <span class="btns"><button type="button" class="btn line" id="b-pause">Пауза печати</button><button type="button" class="btn line" id="b-test">Пробная наклейка</button></span>
    </div>
    <p class="note">Ещё раз — напечатать заново с данными из таблицы</p>
    <ul class="done" id="done"></ul>
    <p class="empty" id="done-empty">Пока ничего не напечатано</p>
  </section>
</main>

<div id="sticker" aria-hidden="true"><span class="fit" id="st-first"></span><span class="fit" id="st-last"></span><span class="fit" id="st-pos"></span><span class="fit" id="st-comp"></span></div>

<script src="config.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var API = window.FORUM_API || '';
  // Секрет сотрудников живёт только в хеше ссылки: на сервер не уходит, никуда не пишется.
  var K = new URLSearchParams(location.hash.slice(1)).get('k') || '';
  // Номер стойки (#d=2): станция печатает только наклейки своей стойки. Без номера — стойка 1.
  var D = new URLSearchParams(location.hash.slice(1)).get('d') || '';
  if (D) { document.title = 'Станция печати · стойка ' + D; document.querySelector('.rule').textContent = 'Стойка ' + D + '. ' + document.querySelector('.rule').textContent; }
  var POLL_MS = 1500;
  // Тормоз: больше LIMIT наклеек за минуту — печать встаёт и ждёт человека (сбой не напечатает рулон впустую).
  var LIMIT = 20;
  // Номер этой вкладки станции: таблица отдаёт наклейку одной станции, вторая на той же стойке её не печатает.
  var SID = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  var SAMPLE = { first: 'Айгерим', last: 'Нурлан', position: 'Product Designer', company: 'Higgs' };

  // Размер страницы печати берём из тех же констант, что и вёрстку наклейки.
  var cs = getComputedStyle(document.documentElement);
  var pageRule = document.createElement('style');
  pageRule.textContent = '@page { size: ' + cs.getPropertyValue('--label-w').trim() + ' ' + cs.getPropertyValue('--label-h').trim() + '; margin: 0 }';
  document.head.append(pageRule);

  var CHECK = '<path d="M5 12.5l4.5 4.5L19 7.5"/>';
  var ALERT = '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/>';
  var STATUS = {
    ok: { bad: false, ico: CHECK, title: 'Станция печати работает' },
    net: { bad: true, ico: ALERT, title: 'Нет связи с таблицей', sub: 'Наклейки напечатаются, когда связь вернётся' },
    stale: { bad: true, ico: ALERT, title: 'Ссылка устарела', sub: 'Попросите новую ссылку у организатора' },
    link: { bad: true, ico: ALERT, title: 'Ссылка неполная', sub: 'Откройте ссылку для сотрудников целиком' },
    addr: { bad: true, ico: ALERT, title: 'Не задан адрес таблицы', sub: 'Впишите адрес в config.js и обновите страницу' },
    phone: { bad: true, ico: ALERT, title: 'Это страница для ноутбука с принтером', sub: 'На телефоне откройте ссылку «Телефоны на входе». Наклейки печатает ноутбук сам' },
    dup: { bad: true, ico: ALERT, title: 'Станция уже открыта в другом окне', sub: 'Закройте эту вкладку' },
    pause: { bad: true, ico: ALERT, title: 'Печать на паузе', sub: 'Новые наклейки ждут. Нажмите «Продолжить печать»' },
    brake: { bad: true, ico: ALERT, title: 'Печать остановлена: больше ' + LIMIT + ' наклеек за минуту', sub: 'Проверьте принтер и очередь, затем «Продолжить печать»' }
  };
  var shown = '';
  function setStatus(kind) {
    if (shown === kind) return;
    shown = kind;
    if (kind === 'net') $('q').textContent = '?';
    var s = STATUS[kind];
    $('status').className = 'status' + (s.bad ? ' bad' : '');
    $('st-ico').innerHTML = s.ico;
    $('st-title').textContent = s.title;
    $('st-sub').textContent = s.sub || '';
    $('st-sub').hidden = !s.sub;
  }

  function h(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  async function api(body) {
    var ctl = new AbortController();
    var t = setTimeout(function () { ctl.abort(); }, 10000);
    try {
      // Без Content-Type: тело уходит как text/plain и обходится без preflight, иначе Apps Script не примет.
      var res = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ k: K }, D ? { d: D } : {}, body)), signal: ctl.signal });
      return await res.json();
    } finally { clearTimeout(t); }
  }

  // ---- Наклейка ----
  // Шрифт Caveat лежит рядом со страницей. Грузится при открытии станции: связь потом пропадёт, а наклейка напечатается тем же шрифтом.
  // Образец с буквами всех наборов (кириллица, казахские буквы, латиница, латиница с диакритикой) подтягивает все файлы.
  function loadFont() {
    ['700', '400'].forEach(function (w) { document.fonts.load(w + ' 40px Caveat', 'Аб Ә Ab ş').catch(function () {}); });
  }

  // Имя и фамилия по одному размеру, должность и компания по своему. Каждая строка целиком по ширине: ужимаем, не режем.
  function fit(ids, max, avail) {
    var els = ids.map($).filter(function (e) { return e.textContent; });
    if (!els.length) return;
    els.forEach(function (e) { e.style.fontSize = max + 'px'; });
    var w = Math.max.apply(null, els.map(function (e) { return e.offsetWidth; }));
    var size = w > avail ? max * avail / w : max;
    els.forEach(function (e) { e.style.fontSize = Math.floor(size * 10) / 10 + 'px'; });
  }

  async function doPrint(p) {
    $('st-first').textContent = p.first || '';
    // Запятая после фамилии, как на образце, если ниже есть должность или компания.
    $('st-last').textContent = (p.last || '') + (p.last && (p.position || p.company) ? ',' : '');
    $('st-pos').textContent = p.position || '';
    $('st-comp').textContent = p.company || '';
    var text = [p.first, p.last, p.position, p.company].filter(Boolean).join(' ');
    await Promise.race([Promise.all([document.fonts.load('700 40px Caveat', text), document.fonts.load('400 40px Caveat', text)]), sleep(4000)]);
    await Promise.race([document.fonts.ready, sleep(4000)]);
    var box = $('sticker'), st = getComputedStyle(box);
    box.style.paddingLeft = '';
    // Запас под отступ лесенки (4 мм) и наклон строк.
    var avail = (box.clientWidth - parseFloat(st.paddingLeft) - parseFloat(st.paddingRight)) * 0.80;
    fit(['st-first', 'st-last'], box.clientHeight * 0.30, avail);
    fit(['st-pos'], box.clientHeight * 0.115, avail);
    fit(['st-comp'], box.clientHeight * 0.115, avail);
    // Весь блок текста по центру наклейки, лесенка внутри блока сохраняется.
    var right = Math.max.apply(null, ['st-first', 'st-last', 'st-pos', 'st-comp'].map($).filter(function (e) { return e.textContent; }).map(function (e) { return e.offsetLeft + e.offsetWidth; }));
    box.style.paddingLeft = parseFloat(st.paddingLeft) + Math.max(0, (box.clientWidth - parseFloat(st.paddingRight) - right) / 2) + 'px';
    window.print();
  }
  // Печать строго по одной: следующая наклейка не затирает текст предыдущей.
  var chain = Promise.resolve();
  function printSticker(p) {
    chain = chain.catch(function () {}).then(function () { return doPrint(p); });
    return chain;
  }

  // ---- Очередь ----
  var unacked = new Set(); // напечатано здесь, но «printed» в таблицу ещё не дошло: заново не печатаем, повторяем только его
  var stopped = false;
  var paused = ''; // '' печатаем, 'pause' — нажали «Пауза печати», 'brake' — сработал тормоз
  var stamps = []; // время последних напечатанных наклеек для тормоза
  var lastDone = '';

  function stop(kind) { stopped = true; setStatus(kind); }

  function setPaused(kind) {
    paused = kind;
    if (!kind) stamps = [];
    $('b-pause').textContent = kind ? 'Продолжить печать' : 'Пауза печати';
    if (!stopped) setStatus(kind || 'ok');
  }

  async function ack(id) {
    try {
      var r = await api({ a: 'printed', id: id });
      if (r.ok || r.error === 'not_found') unacked.delete(id);
      else if (r.error === 'secret') stop('stale');
    } catch (e) { /* связи нет: повторим на следующем опросе */ }
  }

  function renderDone(done) {
    var sig = JSON.stringify(done);
    if (sig === lastDone) return;
    lastDone = sig;
    var ul = $('done');
    ul.replaceChildren.apply(ul, done.map(function (p) {
      var li = h('li', 'card');
      var who = h('div', 'who');
      who.append(h('b', '', [p.first, p.last].filter(Boolean).join(' ')));
      var sub = [p.position, p.company].filter(Boolean).join(', ');
      if (sub) who.append(h('span', '', sub));
      var b = h('button', 'btn line', 'Ещё раз');
      b.type = 'button';
      b.setAttribute('aria-label', 'Ещё раз: ' + [p.first, p.last].filter(Boolean).join(' '));
      b.addEventListener('click', async function () {
        b.disabled = true;
        try {
          var r = await api({ a: 'reprint', id: p.id });
          if (r.error === 'secret') return stop('stale');
          if (!r.ok) throw new Error(r.error);
        } catch (e) { b.disabled = false; setStatus('net'); }
      });
      li.append(who, b);
      return li;
    }));
    $('done-empty').hidden = done.length > 0;
  }

  async function poll() {
    var t0 = Date.now();
    try {
      var res = await api({ a: 'queue', s: SID });
      if (!res.ok) {
        if (res.error === 'secret') return stop('stale');
        throw new Error(res.error);
      }
      setStatus(paused || 'ok');
      renderDone(res.done);
      var skip = new Set(unacked);
      var fresh = res.wait.filter(function (p) { return !skip.has(p.id); });
      $('q').textContent = fresh.length;
      for (var id of skip) await ack(id);
      for (var p of fresh) {
        if (paused) break;
        stamps = stamps.filter(function (t) { return Date.now() - t < 60000; });
        if (stamps.length >= LIMIT) { setPaused('brake'); break; }
        try { await printSticker(p); } catch (e) { continue; }
        stamps.push(Date.now());
        unacked.add(p.id);
        $('q').textContent = Math.max(0, +$('q').textContent - 1);
        await ack(p.id);
      }
    } catch (e) { setStatus('net'); }
    if (!stopped) setTimeout(poll, Math.max(0, POLL_MS - (Date.now() - t0)));
  }

  // ---- Запуск ----
  $('b-test').addEventListener('click', function () { printSticker(SAMPLE); });
  $('b-pause').addEventListener('click', function () { setPaused(paused ? '' : 'pause'); });

  // Ноутбук не должен уснуть: тогда вкладка перестанет опрашивать таблицу.
  async function keepAwake() {
    try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) { /* не критично */ }
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) keepAwake(); });

  // На телефоне и во второй вкладке остаётся только объяснение: очередь и список здесь ничего не значат.
  function onlyStatus() {
    document.querySelector('.rule').hidden = true;
    $('queue').hidden = true;
    document.querySelector('.top').nextElementSibling.hidden = true;
  }

  // Вторая вкладка станции в том же браузере (двойной клик по ярлыку) печатала бы каждую наклейку дважды.
  // Новая вкладка шлёт 'hi', живая отвечает 'here'. Если две открылись разом, остаётся та, у которой id меньше:
  // вторая видит чужой 'hi' с меньшим id и уступает. Ответ не пришёл за 300 мс: станция одна, запускаемся.
  // Закрытая вкладка не мешает: после перезагрузки второй ответить некому.
  function claimStation() {
    if (typeof BroadcastChannel === 'undefined') return Promise.resolve(true);
    return new Promise(function (resolve) {
      var ch = new BroadcastChannel('forum-station'), me = Math.random(), state = 'check', timer;
      function finish(first) {
        clearTimeout(timer);
        state = first ? 'run' : 'dup';
        resolve(first);
      }
      ch.onmessage = function (e) {
        var m = e.data || {};
        if (m.t === 'hi') {
          if (state === 'run' || (state === 'check' && me < m.id)) ch.postMessage({ t: 'here' });
          else if (state === 'check') finish(false);
        } else if (m.t === 'here' && state === 'check') finish(false);
      };
      ch.postMessage({ t: 'hi', id: me });
      timer = setTimeout(function () { finish(true); }, 300);
    });
  }

  // Телефон или планшет станцией не работает: печатать ему некуда, а вторая станция дала бы двойные наклейки.
  var touchOnly = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
  if (touchOnly) {
    stop('phone');
    onlyStatus();
  }
  else if (!K) stop('link');
  else if (!API) stop('addr');
  else claimStation().then(function (first) {
    if (first) { loadFont(); keepAwake(); poll(); }
    else { stop('dup'); onlyStatus(); }
  });
})();
</script>
</body>
</html>

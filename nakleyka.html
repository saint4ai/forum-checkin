<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Наклейка с надписью</title>
<style>
/* Наклейки на стулья: одна надпись крупно, вдоль длинной стороны, по центру, фирменным шрифтом станции.
   Ссылка: nakleyka.html#t=HIGGSFIELD&w=58&h=80&n=10 — w поперёк ленты, h вдоль ленты (мм), n — сколько наклеек. */
@font-face { font-family: "Caveat"; font-weight: 700; src: url(vendor/fonts/caveat-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
@font-face { font-family: "Caveat"; font-weight: 700; src: url(vendor/fonts/caveat-cyrillic-700-normal.woff2) format("woff2"); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
@font-face { font-family: "Caveat"; font-weight: 700; src: url(vendor/fonts/caveat-cyrillic-ext-700-normal.woff2) format("woff2"); unicode-range: U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F; }
body { margin: 0; padding: 16px; background: #F2F2F4; color: #14100E; font: 400 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }
.btn { min-height: 48px; padding: 0 22px; border: 0; border-radius: 14px; background: #14100E; color: #fff; font-size: 17px; font-weight: 600; cursor: pointer; }
.btn:disabled { opacity: .4; cursor: default; }
.lbl { position: relative; width: var(--w); height: var(--h); overflow: hidden; background: #fff; box-shadow: 0 0 0 1px #ccc; margin-bottom: 12px; }
.lbl span { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-90deg); white-space: nowrap; font-family: "Caveat", "Segoe Print", cursive; font-weight: 700; line-height: 1; color: #000; }
@media print {
  body { margin: 0; padding: 0; background: #fff; }
  .bar { display: none; }
  .lbl { box-shadow: none; margin: 0; break-after: page; }
  .lbl:last-child { break-after: auto; }
}
</style>
<style id="page"></style>
</head>
<body>
<div class="bar">
  <button class="btn" id="go" disabled>Напечатать</button>
  <span id="info"></span>
</div>
<div id="labels"></div>
<script>
(function () {
  var q = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
  var text = (q.get('t') || 'HIGGSFIELD').trim();
  var w = +q.get('w') || 58, h = +q.get('h') || 80, n = Math.min(20, Math.max(1, +q.get('n') || 1));
  document.documentElement.style.setProperty('--w', w + 'mm');
  document.documentElement.style.setProperty('--h', h + 'mm');
  document.getElementById('page').textContent = '@page { size: ' + w + 'mm ' + h + 'mm; margin: 0 }';
  var box = document.getElementById('labels');
  for (var i = 0; i < n; i++) {
    var d = document.createElement('div'); d.className = 'lbl';
    var s = document.createElement('span'); s.textContent = text;
    d.appendChild(s); box.appendChild(d);
  }
  document.getElementById('info').textContent = n + ' шт., ' + w + '×' + h + ' мм, «' + text + '»';
  var btn = document.getElementById('go');
  btn.textContent = 'Напечатать ' + n + ' шт.';
  btn.onclick = function () { window.print(); };
  // Размер подбирается после загрузки шрифта: надпись вдоль длинной стороны (повёрнута), 90% длины и не выше 85% ширины.
  document.fonts.load('700 40px Caveat', text).catch(function () {}).then(function () {
    var mm = 96 / 25.4, spans = box.querySelectorAll('span');
    var probe = spans[0]; probe.style.fontSize = '100px';
    var k = Math.min(h * mm * 0.90 / probe.offsetWidth, w * mm * 0.85 / probe.offsetHeight);
    spans.forEach(function (sp) { sp.style.fontSize = (100 * k).toFixed(2) + 'px'; });
    btn.disabled = false;
  });
})();
</script>
</body>
</html>

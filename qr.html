<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>QR для бота</title>
<style>
/* Архив QR для бота клиента: одна кнопка. Токены те же, что в spisok.html (memory-bank/features/design.md). Фон всегда белый. */
:root {
  --bg: #FFFFFF; --group: #F5F5F7; --ink: #1D1D1F; --muted: #6E6E73; --hair: rgba(0,0,0,.08);
  --accent: #0071E3; --accent-press: #0062C4; --bad: #C4261D; --bad-tint: rgba(255,59,48,.08); --warn: #A35A00;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 400 16px/1.4 var(--font); -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
button { font: inherit; touch-action: manipulation; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 520px; margin: 0 auto; padding: max(56px, 12vh) 20px calc(48px + env(safe-area-inset-bottom)); }
h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
.lead { margin: 12px 0 32px; font-size: 17px; line-height: 1.4; color: var(--muted); text-wrap: pretty; }

.go { display: block; width: 100%; min-height: 56px; padding: 0 24px; border: 0; border-radius: 16px; background: var(--accent); color: #fff; font-size: 17px; font-weight: 600; line-height: 1.15; transition: transform 160ms var(--ease), background-color 160ms var(--ease), opacity 160ms var(--ease); font-variant-numeric: tabular-nums; }
.go:active { transform: scale(.98); }
.go:disabled { opacity: .45; cursor: default; transform: none; }
@media (hover: hover) { .go:not(:disabled):hover { background: var(--accent-press); } }
@media (min-width: 600px) { .go { display: inline-block; width: auto; min-width: 320px; } }

.msg { margin: 20px 0 0; padding: 14px 16px; border-radius: 14px; background: var(--bad-tint); color: var(--bad); font-size: 16px; line-height: 1.4; text-wrap: pretty; }
.msg.plain { background: var(--group); color: var(--ink); }

.check { margin-top: 36px; }
.check h2 { margin: 0 0 10px; font-size: 20px; line-height: 1.2; font-weight: 600; letter-spacing: -.01em; }
.check ul { margin: 0; padding: 0; list-style: none; border-radius: 16px; background: var(--group); }
.check li { padding: 12px 16px; font-size: 15px; line-height: 1.35; color: var(--muted); }
.check li + li { border-top: 1px solid var(--hair); }
.check li b { display: block; font-weight: 600; color: var(--ink); }

@media (prefers-reduced-motion: no-preference) { .msg, .check { animation: pop 240ms var(--ease) backwards; } }
@keyframes pop { from { opacity: 0; transform: scale(.98); } }
@media (prefers-reduced-motion: reduce) { .go { transition: none; } .go:active { transform: none; } }
</style>
</head>
<body>
<main class="wrap">
  <h1>QR для бота</h1>
  <p class="lead">Картинка на каждого участника. Файл назван по Telegram username, без него по телефону</p>
  <button type="button" class="go" id="go" disabled>Загружаю список…</button>
  <p class="msg" id="msg" role="alert" hidden></p>
  <section class="check" id="check" aria-labelledby="check-h" hidden>
    <h2 id="check-h">Проверьте</h2>
    <ul id="problems"></ul>
  </section>
</main>

<script src="config.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="vendor/jsQR.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var API = window.FORUM_API || '';
  // Секрет живёт только в хеше ссылки: на сервер не уходит, никуда не пишется и не логируется.
  var K = new URLSearchParams(location.hash.slice(1)).get('k') || '';

  var items = [];       // [ID, Имя, Фамилия, Telegram, Телефон, Код QR] только с кодом
  var busy = false;

  var MSG = {
    link: 'Ссылка неполная. Откройте её целиком из листа «Ссылки» в таблице',
    net: 'Нет связи с таблицей. Проверьте интернет и нажмите «Повторить»',
    empty: 'В таблице пока нет участников с кодом. Вставьте список в лист «Участники», коды появятся сами',
    api: 'Не задан адрес таблицы',
  };

  function say(text, plain) {
    var m = $('msg');
    m.textContent = text || '';
    m.classList.toggle('plain', !!plain);
    m.hidden = !text;
  }
  function setBtn(text, disabled) {
    var b = $('go');
    b.textContent = text;
    b.disabled = !!disabled;
    b.setAttribute('aria-busy', String(!!disabled));
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  // ---- Запрос ----
  async function api(body) {
    var ctl = new AbortController();
    var t = setTimeout(function () { ctl.abort(); }, 15000);
    try {
      // Без Content-Type: тело уходит как text/plain и обходится без preflight, иначе Apps Script не примет.
      var res = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ k: K }, body)), signal: ctl.signal });
      return await res.json();
    } finally { clearTimeout(t); }
  }

  async function load() {
    say('');
    $('check').hidden = true;
    setBtn('Загружаю список…', true);
    var res = null;
    try { res = await api({ a: 'codes' }); } catch (e) { res = null; }
    if (res && res.ok && Array.isArray(res.items)) {
      items = res.items.filter(function (r) { return String(r[5] || '').trim(); });
      if (!items.length) { $('go').hidden = true; return say(MSG.empty, true); }
      return ready();
    }
    if (res && res.error === 'secret') { $('go').hidden = true; return say(MSG.link); }
    setBtn('Повторить', false);
    $('go').onclick = load;
    say(MSG.net);
  }

  function ready() {
    setBtn('Скачать архив · ' + items.length + ' QR', false);
    $('go').onclick = build;
  }

  // ---- Имена файлов: правила scripts/qr-archive.mjs (fileBase), менять только вместе с ним ----
  function cleanUser(tg) {
    return String(tg).trim().replace(/^(https?:\/\/)?(www\.)?t\.me\//i, '').replace(/^@/, '').replace(/[^A-Za-z0-9_]/g, '');
  }
  function fileBase(tg, phone, id) {
    var u = cleanUser(tg);
    if (u) return u;
    var p = String(phone).replace(/\D/g, '');
    return p || id;
  }

  // ---- Zip в режиме STORE: PNG уже сжаты ----
  var CRC = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(bytes) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) c = CRC[(c ^ bytes[i]) & 255] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  // files: [{ name, data: Uint8Array }]. Флаг 0x0800: имена в UTF-8 («список.csv»).
  function zip(files) {
    var enc = new TextEncoder(), now = new Date();
    var time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
    var date = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
    var parts = [], central = [], offset = 0;
    files.forEach(function (f) {
      var name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
      var lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
      lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
      lh.setUint32(18, size, true); lh.setUint32(22, size, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
      var ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
      ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true);
      ch.setUint32(20, size, true); ch.setUint32(24, size, true); ch.setUint16(28, name.length, true);
      ch.setUint32(42, offset, true);
      parts.push(lh, name, f.data);
      central.push(ch, name);
      offset += 30 + name.length + size;
    });
    var cdSize = 0;
    central.forEach(function (p) { cdSize += p.byteLength; });
    var end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
    return new Blob(parts.concat(central, [end]), { type: 'application/zip' });
  }

  // ---- Сборка ----
  var canvas = document.createElement('canvas');

  // PNG с QR; картинка читается обратно из самих байт PNG и сверяется с кодом.
  async function makePng(code) {
    await QRCode.toCanvas(canvas, code, { width: 600, margin: 4, errorCorrectionLevel: 'M' });
    var blob = await new Promise(function (r) { canvas.toBlob(r, 'image/png'); });
    var bmp = await createImageBitmap(blob);
    var ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(bmp, 0, 0);
    if (bmp.close) bmp.close();
    var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    var read = jsQR(img.data, img.width, img.height);
    if (!read || read.data !== code) return null;
    return new Uint8Array(await blob.arrayBuffer());
  }

  var csvCell = function (v) { return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };

  async function build() {
    if (busy) return;
    busy = true;
    say('');
    $('check').hidden = true;
    var enc = new TextEncoder();
    var used = {}, files = [], problems = [];
    var list = [['ID', 'Имя', 'Фамилия', 'Telegram', 'Файл QR']];
    try {
      for (var i = 0; i < items.length; i++) {
        var r = items[i].map(function (v) { return String(v == null ? '' : v).trim(); });
        var id = r[0], first = r[1], last = r[2], tg = r[3], phone = r[4], code = r[5];
        var who = (first + ' ' + last).trim() || id;
        var base = fileBase(tg, phone, id);
        if (!cleanUser(tg)) problems.push({ who: who, text: 'нет username, файл назван ' + base + '.png' });
        if (used[base.toLowerCase()]) {
          problems.push({ who: who, text: 'имя файла ' + base + ' уже занято, назван ' + base + '_' + id + '.png' });
          base = base + '_' + id;
        }
        used[base.toLowerCase()] = true;
        setBtn('Собираю ' + (i + 1) + ' из ' + items.length + '…', true);
        var png = await makePng(code);
        if (!png) { say('Архив не создан: QR участника «' + who + '» не читается обратно. Сообщите нам'); return; }
        files.push({ name: base + '.png', data: png });
        list.push([id, first, last, tg, base + '.png']);
        if (i % 8 === 7) await sleep(0); // экран успевает обновить счётчик
      }
      var csv = '﻿' + list.map(function (row) { return row.map(csvCell).join(','); }).join('\n') + '\n';
      files.push({ name: 'список.csv', data: enc.encode(csv) });
      save(zip(files));
      say('Архив скачан: ' + (files.length - 1) + ' QR и список.csv. Он в папке «Загрузки»', true);
      showProblems(problems);
    } catch (e) {
      say('Архив не создан. Нажмите «Скачать архив» ещё раз');
    } finally {
      busy = false;
      ready();
    }
  }

  function save(blob) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'QR участников.zip';
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 10000);
  }

  function showProblems(problems) {
    var ul = $('problems');
    ul.replaceChildren();
    problems.forEach(function (p) {
      var li = document.createElement('li');
      var b = document.createElement('b');
      b.textContent = p.who;
      li.append(b, p.text);
      ul.append(li);
    });
    $('check').hidden = !problems.length;
  }

  // Новую ссылку вставили в эту же вкладку: меняется только хеш, страница сама не перезагрузится и осталась бы на старом секрете.
  window.addEventListener('hashchange', function () { location.reload(); });

  if (!K) { $('go').hidden = true; say(MSG.link); }
  else if (!API) { $('go').hidden = true; say(MSG.api); }
  else load();
})();
</script>
</body>
</html>
